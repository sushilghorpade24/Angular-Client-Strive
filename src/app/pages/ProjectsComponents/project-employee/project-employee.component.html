<div class="container-fluid px-4 mt-4">

    <!-- Header -->


    <!-- Stats & Add Button -->
    <div class="card bg-gradient-purple text-white p-3 mb-4 shadow-sm rounded-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1">Total Employee</h5>
                <h3>{{ empProjectList.length }}</h3>
            </div>
            <div>
                <!-- Opens #assignProjectModal via Bootstrap -->
                <button class="btn btn-light fw-semibold text-primary" data-bs-toggle="modal"
                    data-bs-target="#assignProjectModal">
                    + Add Employee
                </button>

            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-dark">Project Employee Management</h2>
        
    </div>

    <!-- Client Cards -->

    <div class="row g-4">
        <div class="col-md-4" *ngFor="let emp of empProjectList">
            <div class="card emp-card shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="avatar-circle">
                            {{ emp.empName.charAt(0) }}
                        </div>
                        <div>
                            <h5 class="card-title fw-bold text-primary mb-0">{{ emp.projectName }}</h5>
                            <small class="text-muted">{{ emp.empDesignation }}</small>
                        </div>
                    </div>
                    <p><strong>Start Date:</strong> {{ emp.startDate|date }}</p>
                    <p><strong>Exp End Date:</strong> {{ emp.expectedEndDate }}</p>
                    <p><strong>Client Name:</strong> {{ emp.clientName }}</p>
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button class="btn btn-sm btn-warning" (click)="onEdit(emp)" data-bs-toggle="modal" data-bs-target="#addClientModal">
                            <i class="bi bi-pencil-fill">Edit</i>
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="deleteEmpFromProject(emp.projectEmpId)">
                            <i class="bi bi-trash-fill">Delete</i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>



<div class="modal fade" id="assignProjectModal" tabindex="-1" aria-labelledby="assignProjectModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="assignProjectModalLabel">Assign Project</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <!-- your form here -->
          <form [formGroup]="projectAssignForm" (ngSubmit)="onSubmitProjectAssign()">
                <div class="modal-body custom-modal-body">
                    <div class="row g-3 pb-3">
                        <div class="col-md-6">
                            <label class="form-label">Employee</label>
                            <select class="form-select" formControlName="employeeId">
                                <option value="">-- Select Employee --</option>
                                <option *ngFor="let emp of employeeList" [value]="emp.empId">{{ emp.empName }}</option>
                            </select>
                        </div>



                        <div class="col-md-6">
                            <label class="form-label">Added Date</label>
                            <input type="datetime-local" class="form-control" formControlName="addedDate" />
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="onClearProjectAssignForm()"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" >
                        <!-- [disabled]="projectAssignForm.invalid" -->
                        {{ projectAssignForm.value.projectEmpId ? 'Update' : 'Save' }}
                    </button>
                </div>
            </form>
      </div>
    </div>
  </div>
</div>
