<div class="terms-wrapper bg-light-blue min-vh-100 py-5 px-3 px-md-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold display-4 text-gradient">Terms & Conditions</h1>
    <p class="lead text-muted">Please read these terms carefully before using <strong>Strive</strong>.</p>
  </div>

  <div class="card terms-card p-5 shadow-lg border-0 rounded-4 bg-white">
    <div class="mb-5" *ngFor="let section of termsSections; let i = index">
      <h3 class="fw-semibold text-dark section-title">{{ i + 1 }}. {{ section.title }}</h3>
      <p class="fs-5 text-muted transition-hover">{{ section.content }}</p>
    </div>
  </div>
</div>
